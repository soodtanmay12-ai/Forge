/* ── interface: explanation sheet, cards and controls ── */
const rxLink=(id,t='Why this? →')=>`<button class="lnk" data-a="rx" data-v="${id}">${t}</button>`;
function rxHtml(o){const L=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';return`<h3>${esc(o.title)}</h3><p class="mu">${esc(o.text)}</p><div class="rxs"><div class="eb">Why Forge says this</div>${L(o.why)}</div><div class="rxs"><div class="eb">What it looked at</div>${L(o.data)}</div><div class="rxs"><div class="eb">How sure Forge is</div><span class="pill ${lvlCls(o.conf.level)}">${o.conf.level} confidence</span>${L(o.conf.why)}</div>${o.change&&o.change.length?`<div class="rxs"><div class="eb">What would change this</div>${L(o.change)}</div>`:''}${(o.rs||[]).map(id=>`<button class="opt" data-a="lc" data-v="${id}"><b>${esc(RC(id).ti)}</b><span>Research note · ${esc(RC(id).cf)} confidence</span></button>`).join('')}${o.action?`<button class="pri" data-a="coachAction" data-v="${esc(o.action)}">${esc(o.label)}</button>`:''}<button class="c2" data-a="cs">Close</button>`}
A.rx=v=>{const o=RX[v];if(o)openSheet(rxHtml(o))};
A.rxl=()=>{const it=SS&&SS.items[SS.i];if(!it||!SS.rc)return;openSheet(rxHtml(loadRx(it,SS.rc)))};
const _ca=A.coachAction;A.coachAction=v=>{const had=!!$('#sh').firstChild;if(had){closeSheet();botOpen=false}if(v.startsWith('keep:')){const g=v.slice(5);S.ov=S.ov||{};S.ov.fx=S.ov.fx||{};S.ov.fx[g]=plusD(7);sv();render(false);toast('Keeping full '+MU[g].toLowerCase()+' volume for a week');return}
if(v.startsWith('unkeep:')){const g=v.slice(7);if(S.ov&&S.ov.fx)delete S.ov.fx[g];sv();render(false);return}
if(v==='body'){botOpen=false;tab='p';ptab='bd';render(true);return}_ca(v)};
A.av=v=>{const[w,m]=v.split(':');S.avail=S.avail||{};const k=dstr(+w);if(m==='f')delete S.avail[k];else S.avail[k]=+m;Object.keys(S.avail).forEach(d=>{if(gap(td(),d)>14)delete S.avail[d]});sv();render(false)};
A.stp=()=>{const n=Math.round(+$('#stv').value),d=ymd(new Date(Date.now()-(+$('#std').value)*864e5));if(!Number.isFinite(n)||n<0||n>100000||!$('#stv').value.trim()){toast('Enter a step count between 0 and 100,000.',1);return}S.st[d]=n;sv();render(false);toast('Steps saved')};
A.kcs=()=>{const n=Math.round(+$('#kcv').value);if(!$('#kcv').value.trim()){if(S.kcal){delete S.kcal;sv();render(false);toast('Calorie target cleared')}return}if(!Number.isFinite(n)||n<800||n>6000){toast('Enter a daily calorie target between 800 and 6,000.',1);return}if(!S.kcal||S.kcal.t!==n)S.kcal={t:n,d:td()};sv();render(false);toast('Saved. Forge will wait 14 days before judging the effect.')};
function timeChips(s,ts){if(s<di0()||s>5||ts==='done'||ts==='part')return'';const cur=availOf(s),o=[[0,'Off'],[25,'25'],[45,'45'],[60,'60'],[75,'75'],['f','Full']];return`<div class="tch"><div class="eb">Time available${cur!==undefined?' · '+(cur===0?'off':cur+' min'):''}</div><div class="chips c6" role="group" aria-label="Time available">${o.map(([m,l])=>{const on=m==='f'?cur===undefined:cur===m;return`<button class="${on?'on':''}" data-a="av" data-v="${s}:${m}" aria-pressed="${on}">${l}</button>`}).join('')}</div></div>`}
const di0=()=>S.cur;
function planCard(){const rx=planRx();if(!rx)return'';const p=planWeek(),rows=p.rows.filter(r=>r.target>0);return`<section class="c"><div class="row sp"><h3>Replanned week</h3>${rxLink('plan','Why →')}</div><div class="mu">${esc(rx.text)}</div>${rows.map(r=>`<div class="mrow"><div class="row sp"><span>${MU[r.g]}</span><span class="mu"><b style="color:var(--tx)">${r.done}</b> done · ${r.planned} ahead · target ${r.target}${r.short>=1?` · <span class="am">${r.short} short</span>`:''}</span></div><div class="bar goal ${r.done+r.planned>=r.target?'ok':''}"><i style="width:${Math.min(100,(r.done+r.planned)/Math.max(r.target,1)*100).toFixed(1)}%"></i></div></div>`).join('')}</section>`}
function fatigueCard(){const fx=fatigueEngine(),v=fx.verdict,lab={none:['No sustained drop','ok'],insufficient:['Needs more data',''],local:['Local fatigue','am'],watch:['Watching','am'],systemic:['Body-wide','am']}[v];
const regs=fx.rE.map(r=>{const a=fx.ev.filter(t=>REG[t.g]===r),u=a.filter(t=>t.st==='up').length,d=a.filter(t=>t.st==='down').length;return`<div class="mrow"><div class="row sp"><span>${REGN[r]}</span><span class="mu">${u} rising · ${a.length-u-d} steady · <b style="color:${d?'var(--am)':'var(--tx)'}">${d} down</b></span></div></div>`}).join(''),
msg={none:'Your lifts show no sustained deterioration. Forge compares each lift’s estimated best set across its last 3 to 5 comparable sessions.',insufficient:'Forge needs at least 3 lifts with 3 comparable full sessions each before it judges fatigue.',local:'The drop is confined to one movement region while the rest holds, so Forge treats it as local fatigue.',watch:'Some lifts are down but the evidence is weak or uncorroborated. Forge is watching; nothing changes yet.',systemic:'Declines span several movement regions and other signs agree.'}[v],
ids=fx.rx.map(x=>x.id);return`<section class="c"><div class="row sp"><h3>Fatigue check</h3><span class="pill ${lab[1]}">${lab[0]}</span></div><div class="mu">${msg}</div>${regs?`<div style="margin-top:6px">${regs}</div>`:''}${fx.dn.slice(0,3).map(t=>`<div class="mu" style="margin-top:8px"><b style="color:var(--tx)">${E[t.id][0]}</b> · est. best set ${f(t.pk)} → ${f(t.now)} kg (${sgn(-t.drop)}%)</div>`).join('')}${ids.map(id=>rxLink(id,id==='fx-sys'?'Why, and what to do →':id.startsWith('fx-loc-')&&MU[id.slice(7)]?`Why ${MU[id.slice(7)]} was eased →`:'Why, and what Forge changed →')).join('')}</section>`}
function recompCard(){const r=recompEngine(),ok=r.bw.ok,t=(b,u)=>b.ok?`${sgn(b.b,2)} ${u}/wk`:'—';return`<section class="c"><div class="row sp"><h3>Recomposition</h3><span class="pill ${lvlCls(r.level)}">${r.level} confidence</span></div><div class="t" style="font-weight:600;font-size:16px;line-height:1.3;margin:6px 0 4px">${esc(r.title)}</div><div class="mu">${esc(r.text)}</div>
<div class="tiles" style="margin:14px 0 6px"><div class="tile"><div class="eb tl">Weight trend</div><div class="n v" style="font-size:24px">${t(r.bw,'kg')}</div></div><div class="tile"><div class="eb tl">Waist trend</div><div class="n v" style="font-size:24px">${t(r.bc,'cm')}</div></div></div>${rxLink('recomp','Why, and what Forge looked at →')}</section>`}
function activityCard(){const st=stepStat(7),kc=S.kcal||{};return`<section class="c"><h3>Activity and calories</h3><div class="mu">Optional inputs that make Forge’s body reading more reliable. Steps last 7 days: ${st.days?`${Math.round(st.avg).toLocaleString('en-IN')} average over ${st.days} logged day${st.days===1?'':'s'}`:'none logged'}.</div>
<div class="fld" style="margin:12px 0"><label>Steps<input id="stv" type="number" inputmode="numeric" min="0" placeholder="e.g. 8500"></label><label>For<select id="std"><option value="0">Today</option><option value="1">Yesterday</option></select></label></div><button class="pri" data-a="stp" style="width:100%">Save steps</button>
<div class="fld" style="margin:18px 0 12px"><label>Daily calorie target (optional)<input id="kcv" type="number" inputmode="numeric" min="800" max="6000" placeholder="e.g. 2200" value="${kc.t||''}"></label></div><button class="pri" data-a="kcs" style="width:100%">Save target</button><div class="mu" style="margin-top:10px">Forge never changes your calories for you. It only suggests a small step when several signals agree, then waits 14 days.</div></section>`}
function beginToday(){const d=planWeek().days[S.cur];d&&d.budget?begin(S.cur,'quick',d.min):begin(S.cur)}

/* ───── v32: daily walk (steps target + optional treadmill block) ─────
   No trial identifies a best speed or incline for recomposition. Forge sizes the step target from the user's own average
   (health data level off at 8,000-10,000 steps) and offers a treadmill block with an energy estimate from two published models,
   keeping the incline modest when recovery signals say so. Everything is derived; no new saved state. */
const WK={cad:105,floor:8000,ceil:10000,step:1500,tmin:15,tmax:45,PRE:[['Easy',4.5,0],['Standard',5,6],['Hill',5,10]]};
function walkCost(kg,v,g){const m=v*1000/60,i=g/100,mt=(280.5*i**5-58.7*i**4-76.8*i**3+51.9*i**2+19.6*i+2.5)*m*kg/4184,ac=(.1*m+1.8*m*i)*kg*5/1000;return[Math.min(mt,ac),Math.max(mt,ac)]}
const walkKcal=(kg,v,g,min)=>{const c=walkCost(kg,v,g);return[Math.round(c[0]*min/10)*10,Math.round(c[1]*min/10)*10]},
nI=n=>Math.round(n).toLocaleString('en-IN'),kr=a=>a[0]===a[1]?`${a[0]}`:`${a[0]}–${a[1]}`;
function walkPlan(){return memo('wk',()=>{
const st=stepStat(14),kg=bwt(),fx=fatigueEngine(),base=st.days>=5?Math.round(st.avg):null,
legDay=d=>D[d]&&D[d][1].some(x=>!PI.has(x[0])&&REG[E[x[0]][1]]==='legs'),legs=legDay(S.cur)||legDay((S.cur+6)%7)||fx.loc.some(x=>REG[x.g]==='legs'),
calm=fx.verdict==='systemic'||dlOn()||feel==='rough',mode=calm?'easy':legs?'legs':'normal',
target=base==null?null:(calm||base>=WK.ceil)?Math.round(base/500)*500:Math.min(WK.ceil,Math.round((base+WK.step)/500)*500),
v=mode==='easy'?4.5:5,g=mode==='easy'?0:mode==='legs'?3:6,
min=base==null?20:Math.min(WK.tmax,Math.max(WK.tmin,Math.ceil((target-base)/WK.cad/5)*5)),
kcal=walkKcal(kg,v,g,min),done=S.st[td()]||0,
why=[];
if(base==null)why.push('Forge needs steps logged on at least 5 of the last 14 days before it sets a target, so it does not guess from one day.');
else{why.push(`Steps: in 15 pooled cohorts of 47,471 adults, risk of death fell as daily steps rose and levelled off around 8,000–10,000 steps a day for adults under 60 and 6,000–8,000 for older adults (Paluch 2022). This is observational, so it shows association, not cause.`,
base>=WK.ceil?`You already average ${nI(base)}, above the range where that benefit levels off, so Forge keeps your target at your own level rather than asking for more.`:calm?`Recovery signals are on (body-wide fatigue, a recovery week or a low-energy day), so Forge holds your target at ${nI(target)} instead of raising it, and keeps any treadmill walk level and easy.`:`Forge sets the target about ${nI(WK.step)} steps above your own recent average (${nI(base)}), capped at ${nI(WK.ceil)}, because a step you can sustain beats a round number you cannot. Pedometer programs that added about 2,000 to 4,000 steps produced a pooled 1.27 kg loss over a median of 16 weeks, mostly without control groups (Richardson 2008).`,
'Extra activity does not add energy expenditure one-for-one: in 332 adults from five populations, total expenditure levelled off at higher activity (Pontzer 2016). Forge therefore never turns steps into a promised calorie figure.')}
why.push(`Treadmill: grade raises the energy cost of walking steeply (about 1.4 times level at 5%, 2 times at 10%, from the published fit in Minetti 2002) without adding impact. No trial has tested which speed and incline give the best recomposition. ${mode==='easy'?'Today Forge suggests level walking at 4.5 km/h because recovery signals are on.':mode==='legs'?'Forge keeps the grade at 3% because legs are loaded (leg day today or yesterday, or a local leg decline).':'Forge suggests 5 km/h at 6%, a judgement that keeps recovery cost low. It never goes above 10%.'}`,
'Forge does not use a fat-burning zone: the intensity that burns the highest share of fat is not shown to improve fat loss (Maunder 2018), and interval and steady training changed body fat by similar amounts in 31 studies (Keating 2017).',
'Added aerobic work had a small negative effect on muscle fibre growth in a 15-study meta-analysis, clear for running but not cycling; walking was not analysed (Schumann 2022). That is why the grade stays modest around leg days.');
const rx=rxReg({id:'walk',kind:'walk',tone:'cue',title:base==null?'Log steps to get a walk target':`Walk target ${nI(target)} steps`,
text:base==null?'Log your steps on at least 5 of the next 14 days (Progress > Body) and Forge will set a target from your own average.':`Aim for about ${nI(target)} steps a day (you average ${nI(base)}). Treadmill option: ${min} minutes at ${v.toFixed(1)} km/h and ${g}% incline, about ${kr(kcal)} kcal${base>=WK.ceil?', optional':''}.`,
action:'body',label:'Open Body',why,
data:[base==null?`Steps logged on ${st.days} of the last 14 days`:`Average ${nI(base)} steps over ${st.days} logged day${st.days===1?'':'s'} (last 14 days)`,...(target?[`Target ${nI(target)} steps; today ${done?nI(done)+' logged':'not logged yet'}`]:[]),`Block: ${min} min at ${v.toFixed(1)} km/h, ${g}% grade, body weight ${Math.round(kg)} kg`,`Estimated extra energy ${kr(kcal)} kcal (two models; real cost varies by 20% or more)`,`Sizing assumes about ${WK.cad} steps a minute; yours will differ`,mode==='easy'?'Recovery signals on: target held, level walking':mode==='legs'?'Legs loaded: grade kept at 3%':'No recovery flags'],
conf:{level:'Low',why:['Step target: Moderate. The health association is consistent across cohorts but observational, and it was not tested in people recomposing','Treadmill speed and incline for recomposition: no trial exists, so this is energy arithmetic plus recovery judgement','Energy estimate: two published equations that differ from each other and from the individual; treat it as a range',`Cadence: about ${WK.cad} steps a minute is an assumption from a study of 21–40 year olds (Tudor-Locke 2019)`]},
change:['Logging steps on more days sharpens the average.','Body-wide fatigue, a recovery week or a low-energy day holds the target and keeps walking level.','If weight and waist stall while steps are already at target, the Recomposition card decides about calories; it never changes calories from steps alone.'],rs:['steps','stepsloss','inclinecost','walkfat','walkint']});
return{base,days:st.days,target,mode,v,g,min,kcal,done,kg,calm,legs,rx}})}
function walkToday(){const w=walkPlan();if(!w||w.base==null||S.cur===6)return'';const reached=w.done>=w.target;
const note=w.mode==='easy'?' Keep it easy today.':w.mode==='legs'?' Incline kept low because your legs are loaded.':'';
return`<section class="c"><div class="row sp"><h3>Daily walk</h3>${rxLink('walk','Why →')}</div><div class="mu">Target <b style="color:var(--tx)">${nI(w.target)}</b> steps · you average ${nI(w.base)}${w.done?` · ${nI(w.done)} logged today`:''}${reached?' · <span class="am">target reached</span>':''}</div>${reached?'':`<div class="mu" style="margin-top:6px">Treadmill option: <b style="color:var(--tx)">${w.min} min · ${w.v.toFixed(1)} km/h · ${w.g}% incline</b>, about ${kr(w.kcal)} kcal.${note}</div>`}</section>`}
function walkCard(){const w=walkPlan(),kg=w.kg;return`<section class="c"><div class="row sp"><h3>Treadmill walking</h3>${rxLink('walk','Why →')}</div><div class="mu">${w.base==null?`Log steps on at least 5 of 14 days and Forge sets a daily target from your own average.`:`Daily step target ${nI(w.target)} (you average ${nI(w.base)}).`} No trial has shown an ideal speed or incline for recomposition; these are energy estimates for ${Math.round(kg)} kg, 30 minutes, from two published models. Pick a speed where you reach about 100+ steps a minute and can still talk.</div>${WK.PRE.map(p=>`<div class="mrow"><div class="row sp"><span>${p[0]} · ${p[1].toFixed(1)} km/h · ${p[2]}%</span><span class="mu"><b style="color:var(--tx)">${kr(walkKcal(kg,p[1],p[2],30))}</b> kcal</span></div></div>`).join('')}<div class="mu" style="margin-top:8px">Estimates can be off by 20% or more. Walking does not replace lifting, and Forge never changes calories from steps alone.</div></section>`}

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render(true);
</script></body></html>
