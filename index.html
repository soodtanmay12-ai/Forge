<style>
/* ───────── Forge · design system v17 ─────────
   Scale: 4 · 8 · 12 · 16 · 20 · 24 · 32   Radii: 26 card · 18 control · 14 small
   Type: Geist (UI) · Newsreader (display moments only)               */
@font-face{font-family:'Geist';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/geist-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-opsz-normal.woff2) format('woff2')}

:root{--bg:#f4f3ef;--p:#fff;--p2:#eeece6;--ln:rgba(18,20,28,.085);--tx:#101218;--mu:#636878;--ac:#4150e0;--am:#a35708;--ok:#0c7a55;--bd:#c2344a;
--hi:rgba(255,255,255,0);--sh:0 1px 2px rgba(16,18,24,.04),0 16px 34px -24px rgba(16,18,24,.2);--gl:13%;--dk:56%;--glow:7%;
--f:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--s:'Newsreader','Iowan Old Style',Georgia,serif;--m:var(--f);
--thumb:#fff;--gut:20px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0b0f;--p:#121419;--p2:#1a1d25;--ln:rgba(255,255,255,.08);--tx:#eef0f5;--mu:#8c92a2;--ac:#a7b1ff;--am:#ffbd72;--ok:#5fdcab;--bd:#ff8895;--hi:rgba(255,255,255,.03);--sh:0 1px 0 rgba(255,255,255,.025) inset;--gl:17%;--dk:100%;--glow:11%;--thumb:#2b2f3b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0b0f;--p:#121419;--p2:#1a1d25;--ln:rgba(255,255,255,.08);--tx:#eef0f5;--mu:#8c92a2;--ac:#a7b1ff;--am:#ffbd72;--ok:#5fdcab;--bd:#ff8895;--hi:rgba(255,255,255,.03);--sh:0 1px 0 rgba(255,255,255,.025) inset;--gl:17%;--dk:100%;--glow:11%;--thumb:#2b2f3b;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:124px}
::selection{background:color-mix(in srgb,var(--ac) 30%,transparent)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(90% 34% at 50% -8%,color-mix(in srgb,var(--ac) var(--glow),transparent),transparent 72%)}

/* ── type ── */
h1,h2,h3,.n{margin:0}
h1,h2,h3{font-family:var(--f);letter-spacing:-.02em}
h3{font-size:16px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.ti,.dn,.ov h1,.n,.mv,.lg b,.stats b,.rest b,.sheet h3,.facts b{font-family:var(--s);font-weight:400;font-optical-sizing:auto;font-variant-numeric:lining-nums}
.ti{font-size:clamp(27px,7.8vw,32px)!important;line-height:1.12;letter-spacing:-.015em;margin:8px 0 0}
.dn{font-size:clamp(30px,8.6vw,36px);line-height:1.1;letter-spacing:-.015em;margin:10px 0 8px;text-wrap:balance}
.mu{color:var(--mu);font-size:13.5px;line-height:1.5}
.am{color:var(--am)}.ok{color:var(--ok)}
a{color:var(--ac);text-decoration:none}
ul{padding-left:18px;margin:8px 0}li{margin:6px 0}li::marker{color:var(--mu)}
.eb{font:500 11px/1.3 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.sub{color:var(--mu);font-size:14px;margin:6px 0 0}

/* ── layout ── */
main{max-width:560px;margin:0 auto;padding:28px var(--gut) 24px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.g{flex:1}
.hd{margin:0 0 24px}

/* ── surfaces ── */
.c{position:relative;background:var(--p) linear-gradient(180deg,var(--hi),transparent 50%);border:1px solid var(--ln);border-radius:26px;padding:20px;margin:0 0 12px;min-width:0;box-shadow:var(--sh)}
.c>h3:first-child,.sh h3{margin:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sh .mu{font-size:12.5px;text-align:right}
.c>h3+.mu,.c>.sh+.mu{margin:4px 0 14px}
.hx{--dt:color-mix(in srgb,var(--dc) var(--dk),#000);counter-reset:ex;overflow:hidden;padding:22px 20px 20px;border-color:color-mix(in srgb,var(--dc) 24%,var(--ln));
background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--dc) var(--gl),transparent),transparent 64%),var(--p)}
.hx .hk{display:flex;align-items:center;gap:8px}
.hx .hk i{width:7px;height:7px;border-radius:50%;background:var(--dc);box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 22%,transparent)}
.foc{color:var(--mu);font-size:14.5px;margin:0 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin:0 0 16px;color:var(--mu);font-size:13.5px;font-variant-numeric:tabular-nums}
.meta b{font-weight:600;color:var(--tx)}
.hx a{text-decoration:underline;text-underline-offset:3px}

/* ── exercise list ── */
.ex{counter-increment:ex;display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--ln)}
.ex i{flex:none;width:20px;font:500 11.5px var(--f);font-style:normal;color:var(--dt,var(--mu));font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ex i::before{content:counter(ex,decimal-leading-zero)}
.ex .en{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex .en span{font-size:15.5px;line-height:1.3;font-weight:500;letter-spacing:-.01em}
.ex .en em{font-style:normal;font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.ex .wt{font:500 14px var(--f);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
button.exswap{flex:none;width:34px;height:34px;min-height:34px;padding:0;margin:0 -8px 0 -4px;border:0;background:transparent;color:var(--mu);border-radius:10px;display:grid;place-items:center}
button.exswap svg{width:17px;height:17px}
@media(hover:hover){button.exswap:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 7%,transparent);border:0}}
details.more{margin:0}
details.more>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:13px 0 4px;border-top:1px solid var(--ln);color:var(--mu);font-size:13.5px;font-weight:500;min-height:44px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'';width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.more[open]>summary::after{transform:rotate(225deg) translateY(-2px)}
details.more[open]>summary{padding-bottom:13px;margin-bottom:-1px}
details.more[open]>summary .lbl{display:none}
details.more[open]>summary::before{content:'Show fewer';font:inherit}
details.more:not([open])>summary::before{content:none}

/* ── buttons ── */
button{font:500 15px var(--f);letter-spacing:-.005em;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:11px 16px;cursor:pointer;min-height:44px;min-width:0;white-space:nowrap;transition:transform .12s ease,background-color .2s,border-color .2s,color .2s}
@media(hover:hover){button:hover{border-color:color-mix(in srgb,var(--tx) 22%,var(--ln))}}
button:active{transform:scale(.975)}
button:disabled{opacity:.35;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--tx);color:var(--bg);border-color:transparent;font-weight:600}
@media(hover:hover){.pri:hover{border-color:transparent;opacity:.92}}
.on{background:var(--dc,var(--ac));color:#07090d;border-color:transparent;font-weight:600}
.go{width:100%;min-height:56px;border:0;border-radius:18px;font:600 16.5px var(--f);letter-spacing:-.01em;color:#07090d;background:var(--dc,var(--ac));box-shadow:0 1px 0 rgba(255,255,255,.38) inset,0 12px 26px -16px var(--dc,var(--ac))}
@media(hover:hover){.go:hover{border:0;filter:brightness(1.05)}}
.go:active{transform:scale(.985)}
.gh{background:transparent;color:var(--mu);font-size:13.5px;min-height:44px;border-radius:14px;padding-left:8px;padding-right:8px}
.go.alt{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none;font-weight:600}
@media(hover:hover){.go.alt:hover{filter:none;border:1px solid color-mix(in srgb,var(--tx) 22%,var(--ln))}}
@media(hover:hover){.gh:hover{color:var(--tx)}}
.ft2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ft2 .gh:only-child{grid-column:1/-1}
.row>button:not(.st){padding-left:12px;padding-right:12px}
.st{width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;font-size:22px;font-weight:400;line-height:1;display:grid;place-items:center}
.lnk{background:none;border:0;padding:6px 2px;min-height:36px;color:var(--ac);font-weight:500;font-size:14px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ac) 38%,transparent);text-underline-offset:3px;border-radius:8px}
@media(hover:hover){.lnk:hover{border:0;text-decoration-color:var(--ac)}}
.lnk.dg{color:var(--bd);text-decoration-color:color-mix(in srgb,var(--bd) 38%,transparent)}

/* ── inputs ── */
input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;width:100%;min-height:46px}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
input[type=number]{font-size:16px;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;min-height:0;padding:0;accent-color:var(--ac)}
select{appearance:none;-webkit-appearance:none;margin:0;padding-right:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%238c92a2' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.5l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 15px center}
textarea{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
.fld label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mu);font-weight:500}
.fld input{font-size:16px}

/* ── bars, pills ── */
.bar{height:6px;background:color-mix(in srgb,var(--tx) 8%,transparent);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--dc,var(--ac))}
.pill{display:inline-flex;align-items:center;border:1px solid var(--ln);background:color-mix(in srgb,var(--tx) 4%,transparent);border-radius:99px;padding:4px 12px;font:500 12.5px var(--f);font-variant-numeric:tabular-nums;margin:3px 6px 3px 0;letter-spacing:0}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.pill.am{color:var(--am);border-color:color-mix(in srgb,var(--am) 35%,transparent);background:color-mix(in srgb,var(--am) 9%,transparent)}

/* ── week rings ── */
.rings{display:flex;align-items:center;gap:20px}
.rings svg{flex:none}
svg[aria-label="Weekly rings"] circle{stroke-width:10}
.rings .lgs{flex:1;display:grid;gap:14px}
.lg{display:flex;gap:12px;align-items:center;margin:0}
.lg i{width:8px;height:8px;border-radius:50%;flex:none}
.lg b{font-size:30px;line-height:1;letter-spacing:-.01em}
.lg small{font:400 14px var(--f);color:var(--mu);letter-spacing:0;margin-left:4px}
.lg .mu{font-size:12.5px;line-height:1.2;margin-bottom:4px}
svg[aria-label=Trend]{overflow:visible}

/* ── protein ── */
.pro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px}
.pro .n{font-size:44px;line-height:1;letter-spacing:-.015em}
.pro .n small{font:500 15px var(--f);color:var(--mu);margin-left:4px}
.pro .mu{text-align:right;font-size:12.5px;line-height:1.45}
.pq{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;margin-top:16px}
.pq button{padding-left:8px;padding-right:8px}
.pq button:last-child{background:transparent;border-color:transparent;color:var(--mu);padding-left:12px;padding-right:12px}

/* ── exercise demo stage ── */
.stage{background:linear-gradient(160deg,var(--pl0) 0%,var(--pl1) 100%);border:1px solid var(--ln);border-radius:22px;padding:8px 6px 3px;margin:12px 0;overflow:hidden}
.stage svg{width:100%;height:auto;max-height:min(32vh,300px);display:block}
.stage p{margin:4px 0 8px;text-align:center;font:500 10px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--fz-cap)}
/* anatomical figure */
.fz-o{fill:var(--fz-ol);stroke:var(--fz-ol);stroke-width:.9;stroke-linejoin:round}
.fz-k{fill:url(#fzk)}.fz-f{fill:url(#fzf)}.fz-s{fill:url(#fzs)}.fz-h{fill:var(--fz-hair)}
.fz-hl{fill:var(--fz-hl)}
.fz-m{fill:url(#fzm);stroke:#b4400f;stroke-width:.8;stroke-linejoin:round}
.fz-fb{fill:none;stroke:rgba(130,40,5,.42);stroke-width:.7;stroke-linecap:round}
.fz-align-under{fill:none;stroke:rgba(255,255,255,.94);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fz-align{fill:none;stroke:#13b84c;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.fz-align-dot{fill:#13b84c;stroke:#fff;stroke-width:1.3}
.fz-check{fill:#11c746;stroke:#fff;stroke-width:1.2}
.fz-checkmark{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fz-dt{fill:none;stroke:var(--fz-ol);stroke-opacity:.34;stroke-width:.9;stroke-linecap:round}
.fz-pl{fill:var(--fz-pl)}.fz-ph{fill:var(--fz-k0)}.fz-pt{fill:none;stroke:var(--fz-pl)}
.fz-cb{stroke:var(--fz-cb);stroke-width:1.5;fill:none}
.fz-sc{fill:var(--fz-sc)}.fz-sl{stroke:var(--fz-sl)}.fz-wall{fill:var(--fz-wall)}
.fz-sd{fill:var(--fz-sd)}.fz-fl{stroke:var(--fz-fl);stroke-width:2}
.fzk0{stop-color:var(--fz-k0)}.fzk1{stop-color:var(--fz-k1)}.fzf0{stop-color:var(--fz-f0)}.fzf1{stop-color:var(--fz-f1)}.fzs0{stop-color:var(--fz-s0)}.fzs1{stop-color:var(--fz-s1)}
:root{--pl0:#fff;--pl1:#f1f2f4;--fz-k0:#f2f3f4;--fz-k1:#aeb2b8;--fz-f0:#c7c9cc;--fz-f1:#999da3;--fz-ol:#555a60;--fz-s0:#5a5e63;--fz-s1:#383b3f;--fz-hair:#34373a;--fz-sc:#c9cacc;--fz-sl:#9b9da0;--fz-wall:#e5e6e7;--fz-pl:#52565a;--fz-cb:#92969a;--fz-hl:rgba(255,255,255,.72);--fz-sd:rgba(30,34,38,.13);--fz-fl:#d0d1d2;--fz-cap:#62676c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pl0:#181e30;--pl1:#0a0d17;--fz-k0:#e8ecf8;--fz-k1:#9ea8c8;--fz-f0:#8893b2;--fz-f1:#5f6988;--fz-ol:#070a12;--fz-s0:#3c4363;--fz-s1:#222840;--fz-hair:#565f7d;--fz-sc:#2a3350;--fz-sl:#39436a;--fz-wall:#121829;--fz-pl:#59637f;--fz-cb:#7c87a8;--fz-hl:rgba(255,255,255,.3);--fz-sd:rgba(0,0,0,.5);--fz-fl:#2b3452;--fz-cap:#6c7699}}
:root[data-theme=dark]{--pl0:#181e30;--pl1:#0a0d17;--fz-k0:#e8ecf8;--fz-k1:#9ea8c8;--fz-f0:#8893b2;--fz-f1:#5f6988;--fz-ol:#070a12;--fz-s0:#3c4363;--fz-s1:#222840;--fz-hair:#565f7d;--fz-sc:#2a3350;--fz-sl:#39436a;--fz-wall:#121829;--fz-pl:#59637f;--fz-cb:#7c87a8;--fz-hl:rgba(255,255,255,.3);--fz-sd:rgba(0,0,0,.5);--fz-fl:#2b3452;--fz-cap:#6c7699}


/* ── figure styles + motion v2 ── */
:root[data-fig=anat]{--fz-k0:#9aa0a9;--fz-k1:#5f656e;--fz-f0:#7d838c;--fz-f1:#4b5058;--fz-ol:#0d0f13;--fz-s0:#23262b;--fz-s1:#16181c;--fz-hair:#7b818a;--fz-hl:rgba(255,255,255,0)}
.fzak0{stop-color:#eceef1}.fzak1{stop-color:#b3b8c0}
.am{fill:url(#fzr);stroke:rgba(38,42,50,.55);stroke-width:.3;stroke-linejoin:round}
.am.w2{fill:url(#fzra);stroke:rgba(110,50,5,.7);stroke-width:.35}.am.tn{fill:#ebe5d3;stroke:rgba(90,80,50,.55);stroke-width:.3}.gh .am.w2,.gh .am.tn{fill:#c8cdd5;stroke:none}.am.w{fill:url(#fzrw);stroke:rgba(80,8,8,.75);stroke-width:.35}
.am.d{opacity:.6}
.amg{fill:none;stroke:#ff4a3a;stroke-width:2.6;opacity:.16;stroke-linejoin:round}
.af{fill:none;stroke:rgba(60,66,76,.3);stroke-width:.3;stroke-linecap:round}.gh .af,.gh .amg{display:none}.gh .am,.gh .am.w{fill:#c8cdd5;stroke:none}
.af.w{stroke:rgba(100,8,8,.4)}.af.d{opacity:.6}
.stage{position:relative}
.gcam{position:absolute;left:12px;top:12px;font:600 10.5px/1 system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:color-mix(in srgb,var(--p) 78%,transparent);border:1px solid var(--ln);opacity:.85}
.stage svg.top .fz-fl,.stage svg.top .fz-sd{display:none}
#fg{transform-box:fill-box;transform-origin:50% 60%}
.stage svg.swing #fg{animation:fzswing .5s ease-out}
@keyframes fzswing{0%{opacity:.08;transform:scaleX(.8)}100%{opacity:1;transform:none}}
.fz-sole{display:none}.hr{fill:#2c3036;stroke:#0d0f13;stroke-width:.5}.af2{fill:none;stroke:rgba(20,24,30,.55);stroke-width:.4;stroke-linecap:round}
.fz-trail{fill:none;stroke:#13b84c;stroke-width:1.5;stroke-dasharray:1.5 3.2;stroke-linecap:round;opacity:.8}
.fz-dot{fill:#13b84c;stroke:#fff;stroke-width:1.5}
.stagechk{transition:background .25s,box-shadow .25s,transform .25s}
.stagechk.bad{animation:fzshake .45s}
@keyframes fzshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
#gcap{transition:opacity .2s}

/* ── form guide ── */
.gm line{stroke:#13b84c;stroke-width:1.1}
.gm .gr{fill:none;stroke:#13b84c;stroke-width:1.5}
.gm .gb{fill:#13b84c;stroke:#fff;stroke-width:1.2}
.gm text{fill:#fff;font:700 7.4px var(--f);text-anchor:middle;dominant-baseline:central}
.fz-alert{fill:none;stroke:#ef4444;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.gp{fill:none;stroke:#ef4444;stroke-width:2;opacity:.85}
.stagechk .no{display:none}
.stagechk.bad{background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.22)}
.stagechk.bad .ok{display:none}.stagechk.bad .no{display:inline}
.gv{margin:4px 0 0}
.gvt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--ln);border-radius:14px}
.gvt button{border:0;background:transparent;min-height:36px;border-radius:11px;padding:0 4px;font-size:12.5px;color:var(--mu);font-weight:500;letter-spacing:-.01em}
.gvt button small{font:600 10.5px var(--f);margin-left:3px;padding:1px 5px;border-radius:99px;background:color-mix(in srgb,var(--bd) 16%,transparent);color:var(--bd)}
.gvt button.on{background:var(--thumb);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.16);font-weight:600}
.gvp{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.gvp button{min-height:34px;font-size:12.5px;border-radius:99px;padding:0 12px;background:transparent;color:var(--mu)}
.gvp button.on{background:color-mix(in srgb,var(--bd) 12%,transparent);color:var(--bd);border-color:color-mix(in srgb,var(--bd) 35%,transparent);font-weight:600}
.gvl{list-style:none;margin:2px 0 0;padding:0}
.gvl li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--ln);font-size:14.5px;margin:0}
.gvl li:first-child{border-top:0}
.gvl i{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;background:#13b84c;color:#fff;font:700 11px var(--f);font-style:normal;display:grid;place-items:center}
.gvn,.gvf{font-size:13.5px;line-height:1.55;color:var(--mu)}
.gvn{margin-top:6px;padding-top:12px;border-top:1px solid var(--ln)}
.gvn b,.gvf b{color:var(--tx);font-weight:600}
.gvb{padding:2px 0 4px}
.gvh{font:600 16px var(--f);letter-spacing:-.01em;color:var(--bd);margin:2px 0 4px}
.gvb p{margin:0 0 10px;font-size:14.5px;line-height:1.55}
.gvf{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ok) 9%,transparent);border:1px solid color-mix(in srgb,var(--ok) 24%,transparent);color:var(--tx)}

/* ── guidance ── */
.how{margin:2px 0 6px;color:var(--mu);font-size:14.5px;line-height:1.55}
.cue{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--ln);font-size:14.5px}
.cue b{color:var(--dt,var(--ac));font-weight:600}
.formcheck{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.formcheck>div{padding:12px;border-radius:16px;border:1px solid var(--ln)}
.formcheck>div:first-child{background:color-mix(in srgb,var(--am) 8%,var(--p));border-color:color-mix(in srgb,var(--am) 22%,transparent)}
.formcheck>div:last-child{background:color-mix(in srgb,var(--ok) 8%,var(--p));border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.formcheck b{display:block;font:600 10.5px var(--f);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--mu)}
.formcheck>div:first-child b{color:var(--am)}.formcheck>div:last-child b{color:var(--ok)}
.formcheck span{font-size:13px;line-height:1.45}
@media(max-width:350px){.formcheck{grid-template-columns:1fr}}
.fix{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--ln);font-size:13.5px;line-height:1.55;color:var(--mu)}
.fix b{color:var(--tx);font-weight:600}
.fix .lnk{font-size:13.5px;min-height:0;padding:2px 0}
details.c>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;min-height:24px}
details.c>summary::-webkit-details-marker{display:none}
details.c>summary::after{content:'';flex:none;width:7px;height:7px;border-right:1.6px solid var(--mu);border-bottom:1.6px solid var(--mu);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details[open].c>summary::after{transform:rotate(225deg) translateY(-2px)}
details.c>summary b{font-weight:600;font-size:15px}
details.c>summary b+.mu{flex:1;text-align:left;margin-left:-6px}
details.c .c{background:none;border:0;border-radius:0;padding:0;margin:0;box-shadow:none}
details.c .c>b:first-child{display:none}

/* ── notices (check-ins) ── */
.grp{margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between}
.grp h3{font-size:13px;font-weight:600;color:var(--mu);letter-spacing:.01em}
.att{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:22px}
.att .eb{color:var(--ac)}
.att .t{font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.3}
.att>.mu{margin:0}
.att>.pri{margin-top:10px;min-height:46px;font-size:15px;border-radius:14px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);font-weight:600}
@media(hover:hover){.att>.pri:hover{border-color:color-mix(in srgb,var(--tx) 22%,var(--ln));opacity:1}}
.att>.fld{margin:8px 0 4px}
.att.rsm{gap:4px;padding:20px;border-color:color-mix(in srgb,var(--dc) 38%,var(--ln));background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--dc) 16%,transparent),transparent 66%),var(--p)}
.att.rsm .eb{color:var(--dt,var(--mu))}
.att.rsm .go{margin-top:12px;min-height:52px}
.att.rsm .lnk{align-self:center;margin-top:2px}
.rdy .rh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.rdy .rrow{display:flex;align-items:center;gap:12px;margin:8px 0}
.rdy .rl{width:56px;flex:none;font-size:14px;font-weight:500}
.rdy .opts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:14px;background:color-mix(in srgb,var(--tx) 6%,transparent)}
.rdy .opts button{min-height:38px;padding:0 4px;border:0;background:transparent;border-radius:11px;font-size:13.5px;color:var(--mu);font-weight:500}
.rdy .opts button.pri{background:var(--thumb);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.rdy .rm{margin-top:12px}
.rdy>.pri{margin-top:10px}

/* ── low-energy switch ── */
.sw{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:color-mix(in srgb,var(--tx) 4%,transparent);border:1px solid var(--ln);border-radius:18px;padding:10px 14px 10px 16px;min-height:56px;white-space:normal;margin:0 0 10px}
.sw .t{flex:1;min-width:0}.sw .t b{display:block;font-weight:600;font-size:14.5px}.sw .t span{display:block;color:var(--mu);font-size:12.5px;line-height:1.35;margin-top:1px;font-weight:400}
.sw i{width:44px;height:26px;border-radius:99px;background:color-mix(in srgb,var(--tx) 18%,transparent);position:relative;flex:none;transition:background .3s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.sw[aria-pressed=true]{border-color:color-mix(in srgb,var(--dc,var(--ac)) 40%,var(--ln))}
.sw[aria-pressed=true] i{background:var(--dc,var(--ac))}
.sw[aria-pressed=true] i::after{transform:translateX(18px)}

/* ── nav dock ── */
nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 40px);max-width:380px;display:flex;gap:4px;padding:5px;border-radius:28px;background:color-mix(in srgb,var(--p) 78%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--ln);box-shadow:0 18px 40px -20px rgba(0,0,0,.45);z-index:5}
nav .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px - 8px)/3);border-radius:23px;background:color-mix(in srgb,var(--tx) 8%,transparent);transform:translateX(calc(var(--x,0)*(100% + 4px)));transition:transform .45s var(--spring)}
nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:7px 0;border:0;border-radius:23px;background:transparent;color:var(--mu);font:500 11px var(--f);letter-spacing:.02em;transition:color .25s}
nav button.on{background:transparent;color:var(--tx);font-weight:600}
nav button.on svg{color:var(--ac)}
nav svg{width:22px;height:22px;stroke-width:1.6;transition:transform .3s var(--spring),color .25s}

/* ── motion ── */
#m.in>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
#m.in .bar i{animation:grow .9s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 160ms);transform-origin:left}
#m.in .rg{animation:ring 1.2s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 160ms)}
.bar i,.rg{transition:width .8s var(--ease),stroke-dashoffset 1s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
@keyframes fade{from{opacity:0}}
@keyframes ln{from{stroke-dashoffset:1}}

/* ── week strip ── */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -4px 12px}
.days button{display:flex;flex-direction:column;align-items:center;gap:9px;padding:11px 0 12px;min-height:72px;border-radius:18px;background:transparent;border-color:transparent}
.days button .eb{letter-spacing:.06em;font-size:10.5px}
.days button.sel{background:var(--p);border-color:var(--ln);box-shadow:var(--sh)}
.days button.sel .eb{color:var(--tx)}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--tx) 15%,transparent);font:600 12px var(--f);color:#07090d;transition:transform .3s var(--spring)}
.dot.done{background:var(--dc);border-color:var(--dc)}
.dot.part{background:var(--am);border-color:var(--am)}
.dot.miss{border-color:var(--bd);color:var(--bd)}
.dot.today{border-color:var(--dc);box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 22%,transparent)}
.dot.skip{border-style:dashed}
.days .sel .dot{transform:scale(1.1)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--mu);font-size:12px;margin:0 0 20px;padding:0 2px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg .dot{width:11px;height:11px;border-width:1.5px;font-size:0}
.dcard.sw-in{animation:rise .4s var(--ease)}

/* ── progress tabs ── */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--ln);border-radius:16px;margin:0 0 16px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:4;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.seg button{border:0;background:transparent;min-height:38px;border-radius:13px;padding:0 2px;font-size:13px;color:var(--mu);font-weight:500;letter-spacing:-.01em}
.seg button.on{background:var(--thumb);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.16);font-weight:600}
.mrow{margin-top:16px}
.mrow:first-of-type{margin-top:4px}
.mrow .row{align-items:baseline}
.mrow .row b{font-weight:500}
.mrow .pl{font-size:12px;margin-top:1px;color:var(--mu)}
.bar.goal{position:relative;overflow:visible;margin-top:8px}
.bar.goal u{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--tx) 34%,transparent)}
.bar.ok i{background:var(--ok)}
.mv{font-size:32px;line-height:1;letter-spacing:-.01em}
.mv small{font:500 13px var(--f);color:var(--mu);margin-left:4px}
.dl{font-size:13px;font-weight:500}
.dl.dn2{color:var(--ok)}.dl.up{color:var(--am)}
.empty{text-align:center;color:var(--mu);padding:12px 6px}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
.hab li{margin:8px 0}
.hist{padding:12px 0;border-top:1px solid var(--ln)}
.hist:first-of-type{border-top:0}

/* ── sheets ── */
#sh .scrim{position:fixed;inset:0;z-index:30;background:rgba(4,5,9,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .25s}
#sh .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;z-index:31;background:var(--p);border:1px solid var(--ln);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;box-shadow:0 -24px 60px -24px rgba(0,0,0,.5);animation:up .38s var(--ease)}
#sh .sheet::before{content:'';display:block;width:36px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--tx) 20%,transparent);margin:2px auto 18px}
#sh.out .scrim{animation:fadeo .2s forwards}
#sh.out .sheet{animation:upo .2s ease-in forwards}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes upo{to{transform:translate(-50%,40px);opacity:0}}
@keyframes fadeo{to{opacity:0}}
.sheet h3{font:400 27px/1.12 var(--s);letter-spacing:-.012em;margin-bottom:6px}
.sheet>p.mu{margin:0 0 16px;font-size:14px;line-height:1.5}
.sheet>p:not(.mu){font-size:14.5px;line-height:1.6;margin:12px 0}
.sheet>button{display:block;width:100%;min-height:50px;border-radius:16px;margin:8px 0 0;text-align:left;white-space:normal}
.sheet>button.pri{text-align:center}
.sheet>button.c2{text-align:center;background:transparent;border-color:transparent;color:var(--mu);margin-top:6px}
.sheet>button.dgr{text-align:center;color:var(--bd);background:transparent;border-color:transparent}
.sheet>.opt,.sheet>.jr{margin:0 0 1px;border-radius:0;border:0;background:var(--p2);padding:13px 16px}
.sheet>h3+p+.opt,.sheet>h3+p+.jr{border-radius:18px 18px 0 0}
.sheet>.opt:has(+ :not(.opt)),.sheet>.jr:has(+ :not(.jr)){border-radius:0 0 18px 18px;margin-bottom:10px}
.sheet>h3+p+.opt:has(+ :not(.opt)),.sheet>h3+p+.jr:has(+ :not(.jr)){border-radius:18px}
.sheet .opt{display:block}
.sheet .opt b{display:block;font-weight:600;font-size:15px}
.sheet .opt span{display:block;color:var(--mu);font-size:13px;line-height:1.4;font-weight:400;margin-top:2px}
.sheet .opt[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 12%,var(--p2))}
.sheet .fld{margin:4px 0 16px}
.sheet .row.sp{gap:16px}
.jr{display:flex!important;align-items:center;gap:12px;text-align:left}
.jr .ix{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f);background:color-mix(in srgb,var(--tx) 8%,transparent);flex:none}
.jr .jn{flex:1;min-width:0;white-space:normal;line-height:1.25}
.jr .jc{font:500 13px var(--f);color:var(--mu);font-variant-numeric:tabular-nums}
.sheet>.jr.cur{background:color-mix(in srgb,var(--dc,var(--ac)) 12%,var(--p2))}
.jr.fin2 .ix{background:var(--ok);color:#07090d}

/* ── toasts ── */
#tt{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;pointer-events:none;display:grid;gap:8px;width:calc(100% - 40px);max-width:400px}
.toast{background:var(--tx);color:var(--bg);border-radius:16px;padding:12px 16px;font-weight:500;font-size:14px;box-shadow:0 16px 36px -14px rgba(0,0,0,.5);animation:drop .4s var(--spring),fadeo .3s 2.3s forwards}
.toast.bad{background:var(--bd);color:#fff}
@keyframes drop{from{transform:translateY(-24px) scale(.96);opacity:0}}

/* ── coach ── */
#bot{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(var(--gut),calc((100vw - 560px)/2 + var(--gut)));z-index:7;font-family:var(--f)}
#bot .botfab{position:relative;display:grid;place-items:center;width:42px;height:42px;min-height:42px;padding:0;border:1px solid var(--ln);border-radius:50%;background:var(--p);color:var(--ac);box-shadow:var(--sh)}
#bot .botfab svg{width:20px;height:20px}
#bot .botfab .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#bot .botbadge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:99px;background:var(--ac);color:var(--bg);font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--p)}
#bot .botbadge.q{min-width:8px;width:8px;height:8px;padding:0;font-size:0}
#bot .botscrim{position:fixed;inset:0;z-index:0;background:rgba(4,5,9,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .25s}
#bot .botwin{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;height:auto;max-height:86dvh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--ln);border-bottom:0;border-radius:28px 28px 0 0;background:var(--p);box-shadow:0 -24px 60px -24px rgba(0,0,0,.5);animation:up .38s var(--ease)}
#bot .bothead{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px 20px}
#bot .bothead::before{content:'';position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:color-mix(in srgb,var(--tx) 20%,transparent)}
#bot .botbrand{display:flex;align-items:center;gap:12px;min-width:0}
#bot .botavatar{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--ac) 14%,var(--p2));color:var(--ac);font-size:18px}
#bot .botbrand b{display:block;font-size:15px;font-weight:600}
#bot .botbrand span{display:block;color:var(--mu);font-size:12px;margin-top:1px}
#bot .botclose{width:38px;height:38px;min-height:38px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--mu);font-size:20px;line-height:1}
#bot .botbody{flex:1;min-height:0;overflow:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
#bot .botstate{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--mu);font-size:12px}
#bot .botstate i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
#bot .botlead{padding:18px;border:1px solid color-mix(in srgb,var(--ac) 28%,var(--ln));border-radius:22px;background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 9%,var(--p)),var(--p))}
#bot .botlead[data-tone="attention"]{border-color:color-mix(in srgb,var(--am) 40%,var(--ln));background:linear-gradient(150deg,color-mix(in srgb,var(--am) 10%,var(--p)),var(--p))}
#bot .botlead[data-tone="win"]{border-color:color-mix(in srgb,var(--ok) 34%,var(--ln));background:linear-gradient(150deg,color-mix(in srgb,var(--ok) 9%,var(--p)),var(--p))}
#bot .botkicker{color:var(--ac);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
#bot .botlead[data-tone="attention"] .botkicker{color:var(--am)}
#bot .botlead[data-tone="win"] .botkicker{color:var(--ok)}
#bot .botlead h3{margin:8px 0;font:400 24px/1.15 var(--s);letter-spacing:-.012em}
#bot .botlead p{margin:0;color:var(--mu);font-size:14px;line-height:1.55}
#bot .botconfidence,#bot .botcue small{display:block;margin-top:10px;color:var(--mu);font-size:11.5px;line-height:1.35}
#bot .botlead .pri{width:100%;margin-top:14px;min-height:46px;font-size:15px}
#bot .botsection{margin-top:24px}
#bot .botsection>h4{margin:0 0 10px;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.02em}
#bot .botcue{padding:14px 0;border-top:1px solid var(--ln)}
#bot .botsection>h4+.botcue{border-top:0;padding-top:2px}
#bot .botcue strong{display:block;font-size:14.5px;font-weight:600}
#bot .botcue p{margin:4px 0 0;color:var(--mu);font-size:13px;line-height:1.5}
#bot .botcue .lnk{margin-top:4px;padding-left:0}
#bot .botsnapshot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#bot .botmetric{min-width:0;padding:14px;border-radius:16px;background:var(--p2)}
#bot .botmetric:last-child:nth-child(odd){grid-column:1/-1}
#bot .botmetric b{display:block;font:400 26px/1 var(--s);font-variant-numeric:lining-nums tabular-nums}
#bot .botmetric span{display:block;margin-top:6px;color:var(--mu);font-size:12px;line-height:1.35}

/* ── session ── */

FORGE HANDOVER (plain text, lives inside index.html on purpose)
================================================================

---------------------------------------------------------------------------------------
1. Whatever is changed in ANY chat must be written into this block in the same delivery as the code change. No separate handover document, no "summary for the next chat". This block IS the handover.
2. At the start of every chat about Forge, read this whole block before touching anything. If the owner uploads index.html or the zip, this block is the source of truth for what exists and why.
3. Every delivery must do all of these, in this order:
   a. Make the change.
   b. Add a numbered entry to CHANGELOG below (version, what changed, why, files touched, how it was verified, known gaps).
   c. Update CURRENT STATE and OPEN ITEMS below if they changed.
   d. Bump the cache name in sw.js (forge-vNN) so installed copies refresh.

4. Append, never rewrite history. Old entries stay. Corrections are new entries that say what they correct.
5. Keep this block plain text. It sits in a script tag of type text/plain, so it never runs. It must never contain the closing script tag text, and never contain code that is meant to execute.
6. Be honest in entries: say what was verified and how, and what was NOT verified (for example "not run on a real phone"). Do not claim a result that was not checked.
7. Anything the owner states as a standing preference about Forge goes in OWNER DIRECTIONS below, in his words as closely as possible.

WHAT FORGE IS
-------------
A single-file personal gym trainer web app (PWA). Files: index.html (app, styles, scripts, research text, this block), sw.js (offline cache), manifest.webmanifest, icons, fonts (Geist, Newsreader), README.md. It is hosted on GitHub Pages. All data stays on the device (localStorage); progress photos are stored locally on the device; no cross-device sync. The research text that drives the coaching lives in the script tag with id "rs" as plain text. The exercise animations ("gifs") are drawn by code in the main script; there are no image or video files.

OWNER DIRECTIONS (standing)
---------------------------
- Fixed 6-day week. If a day is skipped, the remaining days' sets readjust. No readjusting when he is simply starting today.
- Forge should be an extremely intelligent virtual personal trainer that calibrates to him and his progress, driven by the research text, drawing conclusions from several sources.
- Every machine and exercise has its own weight. He types the weight he actually used each time; never apply one entered weight to all lifts.
- Food logging does not need enhancing (he handles it himself for now).
- Progress photos saved locally; PWA hosted on GitHub; no sync.
- Animations: wants the exercise gifs to be as close to photoreal and anatomically accurate as possible: real muscle shapes (heads and attachments), the working muscles highlighted on their actual anatomy (not a blob at an approximate spot), clean structure without overlapping clutter, proper hands and feet, and smooth motion with no stutter.
- Every exercise must be depicted exactly as it is performed (method, path, tempo). Where one camera angle cannot show the exercise, use a different angle or a multi-angle camera.
- Do not simplify the figure to a silhouette; the earlier idea of using a yellow or white guy was a starting point only.

CURRENT STATE (update this section whenever it changes)
-------------------------------------------------------
Version: v33 (cache name forge-v33). v33 is the v32 code plus the merged handover (no behaviour change).
Training intelligence (v31). All on-device rules, no external service. Memoised on SV (a counter bumped inside sv()), the date, today's feel and the deload flag.
- planWeek(): the one place that decides every remaining day's sets. Inputs: the fixed programme D, logged sessions, missed days (S.sk and unlogged past days), readiness (S.rd), minutes available per day (S.avail, date -> 0, 25, 45, 60 or 75; 0 means off), the fatigue engine's trims and exPrio() exercise priority. Steps: (1) fatigue trim for a muscle only at Moderate confidence or higher and only if the owner has not pressed Keep full volume (S.ov.fx, muscle id -> date until which the trim is off); (2) context need per muscle against the volume bands; (3) time budget per day via capOf(min)=max(3,floor((min-6)/3.2)) working sets and pickQuick(); (4) missed-volume deficits added to exercises already in that day, at most 6 added sets per day, at most 11 effective sets per muscle per session, none on deload or rough days or for a trimmed muscle. items(di,mode,minutes) reads from planWeek() so Today and Week previews match the session that Start opens (this also fixes a v30 mismatch where the preview and the session could differ). beginToday() starts a quick session when the planner budgeted today.
- fatigueEngine(): per-lift trend from estimated 1RM (Epley), baseline = median of earlier sessions. A lift is "down" only if it is at least 4% below that baseline, the last two sessions are both at or below 0.975 of it, and the slope is at most -0.8% per session. Lifts are grouped into push, pull, legs, core. Verdict: local (exactly one region declining while the other regions are measurable and not soft), systemic (two or more soft regions, at least two lifts down and at least two corroborating signals such as readiness, skips, sleep, effort), watching (some evidence, not enough to act) or none. Regional mean softness of 2.5% or more is what stops a body-wide decline being mislabelled as local. Systemic verdicts only advise (lighter week stays user-started); local verdicts at Moderate or higher trim about a quarter of that muscle's remaining direct sets (floor 2 for compounds, 1 for isolation).
- recompEngine(): weekly-bucket least-squares trends for weight and waist with standard errors and noise floors (0.35 kg, 0.5 cm), plus training consistency, protein logging, steps and the optional calorie target. Verdicts: collecting, recomp, cutting, fast, stalled, gaining, leangain, scale, unclear, mixed. Calorie actions are hold, reduce (100-150 kcal) or raise (100-150 kcal) and are produced only if every gate passes: at least 3 weeks of body data, waist confirmation, 14 days since the last calorie change, at least 12 sessions in 28 days, no body-wide fatigue, and for a cut protein logged on at least 6 of 14 days. Otherwise a "blocked" reason is shown. Confidence is capped at Moderate because calorie intake is not tracked.
- Explanations: every recommendation is an rx object {id, kind, tone, title, text, why[], data[], conf{level, why[]}, change[], rs[], action, label} registered in RX. rxLink(id) opens it in the A.rx sheet: why, the data behind it, confidence with its reasons, what would change the advice, linked research notes, and the one-tap action. loadRx() explains every load suggestion (Why this load? in the session, in Progress and in the Coach). coachSignals() was rewritten to carry rx ids: order is rest, fatigue, readiness, rough, deload, planner, rhythm, frequency, skips, sleep, effort, plateau, mover, rhythm change, recomposition, protein, defaults; returns at most 4.
- UI: Today plan-adjusted card with +N/-N badges on exercises; Week time chips (Off, 25, 45, 60, 75) and Replanned week card; Progress > Training Fatigue check card above the weekly review; Progress > Body Recomposition card and Activity and calories card (steps and an optional daily calorie target the owner types in; not food logging).
- New state keys: avail, kcal ({t,d}), ov ({fx:{muscleId:date}}). Also S.st (steps, already in the data model) now has an input. All three new keys are in backup export, in validBackupV10 and in the restore whitelist.
- Research notes added to the rs block: fatiguelocal (Meeusen 2013 ECSS/ACSM overtraining consensus, low), weightnoise (Orsama 2014, moderate), lossrate (Garthe 2011, moderate). Each states its own judgement caveats.
- Daily walk (v32, tools/v32-walk.js content is inside index.html): walkPlan() (memoised) derives everything from S.st, body weight, fatigueEngine().verdict/loc, dlOn() and today's feel; it adds NO new saved state. Base = mean of steps logged in the last 14 days (needs at least 5 logged days, otherwise no target and no Today card). Target = base + 1,500 rounded to 500, capped at 10,000; if base is already 10,000 or more, or if recovery signals are on (fatigue verdict systemic, recovery week, low-energy day), the target is held at the base. Treadmill block: minutes = ceil((target - base) / 105 steps per minute / 5) * 5 clamped to 15-45; speed 5.0 km/h; grade 6% normally, 3% when legs are loaded (leg day today or yesterday, or a local leg decline), 0% at 4.5 km/h when recovery signals are on; never above 10%. Energy estimate = range between the Minetti 2002 polynomial and the ACSM walking equation (net of resting), per body weight, rounded to 10 kcal (walkCost, walkKcal). UI: walkToday() card on Today (not on Sunday, not without a base), walkCard() on Progress > Body (three presets for 30 minutes), rx id walk (confidence Low overall, with the Moderate and Low parts spelled out), and a Coach card when the 14-day step average is under 8,000 and nothing else needs attention. Research notes steps, stepsloss, inclinecost, walkfat, walkint were added to the rs block.
- Fix found while writing it: the planner's fatigue checks must read fatigueEngine().verdict (there is no .v property).
- All numeric thresholds above (4%, 0.975, -0.8% per session, 2.5%, one quarter trim, 0.75% per week, 14-day cooldown, the gates) are Forge judgement, not validated clinical rules.
Demo engine (the "gif" engine), how it works:
- Data: SP holds one entry per exercise. Side-view entries are built with the helper mk(common, a, b): pose a is the start (u=0), pose b is the end (u=1); poses hold hip P, torso angle t, head angle hd, ankle targets A/Af, foot angles fo/fof, arm angles ua/fa or wrist targets W, elbow bend sign eb, knee bend sign kb, spine curve cv, shoulder raise sr, and arm reach factors ar (upper arm) and af (forearm) for foreshortening. Front/back-view entries use f:1, bk:1 for back, a and b as [upper arm angle, forearm angle], r as [reach at start, reach at end] (negative means the arm points the other way along the line of sight), pr as blade protraction, lag for per-channel timing, top:1 for the top-down camera (the back figure rotated to lie flat). p names the prop (b barbell, d dumbbell, h handles, hip, plr leg press platform, band, and others). s is the scenery (bench, pad, wall) as SVG.
- Solver: pz() turns a pose into joints with simple two-bone IK. poseAt() interpolates a to b (with optional lag per channel through LGU). Limb lengths are fixed: thigh 34, shin 32, upper arm 22, forearm 20, torso 42.
- Drawing: side() draws the side figure; front() draws the front/back figure. Both draw a grey base body, then the anatomy atlas on top. The atlas (AT for side, ftM for front/back) lists muscles by head with profiles in a limb-local frame (position along the bone, front edge offset, rear edge offset); MS() turns a profile into a smooth path with fibre lines; tendons are drawn pale; the patella is a circle. ON() decides state per muscle group: primary mover (red), secondary mover (amber, from the SYN map), or off (grey). Hands (HAND, THUMB, HANDD) and feet (FOOT, FOOTD) are drawn from outlines in a local frame so they follow the forearm and the shin.
- Which muscle group an exercise works comes from the E table (second field). SYN lists the synergists per group; it is a per-group rule, not per-exercise.
- Motion: tlFor(id) builds the timeline from TEMPO[id] = [seconds a to b, hold at b, seconds b to a, hold at a], taken from each exercise's method cues. Easing is a smootherstep. No overshoot. Breathing adds a tiny shoulder raise in side views.
- Overlays: ghosts (both ends of the range in Movement; the correct pose behind the faulty one in Mistakes) drawn flat and faint; a dashed path trace with a live dot on the bar, handle, foot or hips; the green to red spine ribbon; the status badge that shakes on an error; the caption cycles through the exercise's own cues, one per rep.
- Rendering (important for smoothness): go() draws the static layer (ghosts, trail) once into #fgs and keeps the moving figure in #fgd. Each frame the new markup is NOT parsed into the page; putFrame() walks the new tag list and only updates changed attributes on the existing elements. It falls back to a full rebuild if the structure ever differs. The loop runs at 60 fps and drops itself to 30 fps if a frame costs more than about 11 ms. Reduced-motion users get a still frame.
- Cameras: an exercise can have a second angle stored as SP["<id>~"] (same muscle group as the main entry, copied into E). camsOf(id) lists the angles, camName() names them (Side, Back, Front, Top; set with cn). The Movement view shows chips (Orbit and one per angle). Orbit swings to the next angle every two reps with a short swing animation; tapping an angle fixes it. Pose-specific views Right position and Mistakes use the main angle only (their data in GV refers to the main angle's joints).
- Exercises with a second angle now: yr (Top), pa (Side), fp (Side), rpd (Side, seated), ws (Side), csr (Back), pp (Back).
- Form guide data lives in GV (u of the good pose, pts markers, bad = list of mistakes with pose overrides o and the joint they ring at).

CORE LOGIC RULES (as of the original handover; read before changing behaviour)
- Recommended weight: double progression from the last session of that lift: every set at the top of the range adds one load step (two steps if average reps left was 3 or more); average reps more than 1 below the bottom drops 5%; otherwise hold and add a rep. Gap factor by days since the lift: 10 or fewer x1, 11-21 x0.95, 22-35 x0.90, more than 35 x0.85. First time on a lift: bodyweight x a ratio in W0 (for example bench 0.55, lat pulldown 0.6, leg press 1.3), rounded to the load step and labelled as an estimate.
- Next-set autoregulation: estimated max = weight x (1 + (reps + repsLeft)/30) (Epley); next set load = estimate / (1 + (topReps + 1)/30), clamped to +/-10% of the current load. Planned reps: bottom of the range after a load increase, otherwise last reps + 1 (capped); new lifts start mid-range. [changed] v30 and later also use logged reps in reserve to avoid adding reps after a failure set and to restart near the bottom after a long break (see README).
- Volume: auto-easing to two thirds if the last session is 14 or more days old or over half its sets ended at zero reps left, with one-tap override; deload suggested every sixth week with sets x0.6 at the same loads; mini-session (25 min) is the first three non-posture lifts up to 3 sets each. [changed] v30 has 25/45/60/75 minute sessions that prioritise the largest volume gaps; v31 moves this into planWeek.
- Missed days: chkm looks back 3 days; a Monday-Saturday session with no log and no skip raises a make-up card for 3 days. Skip reasons: sick or pain means rest and no make-up; short on time means a mini-session now; tired or travelling means tomorrow runs as planned plus a make-up offer. [changed] v31 redistributes missed volume through planWeek (caps and rules in CURRENT STATE).
- Progress: weekly sets per muscle, estimated max trend per lift, weight and waist trends, 28-day sessions and skips, rings for sessions, sets and protein.

RESEARCH LOG (what was read, how, and how it is used). Approach throughout: web search, then primary abstracts or publisher pages where reachable; full texts were generally NOT read. The research text that drives the app lives in the rs block (RC reads it); keep this log and that block consistent.
Original handover table:
- Training frequency: Schoenfeld, Ogborn, Krieger 2016 (meta-analysis) and Schoenfeld, Grgic, Krieger 2019: twice a week beat once, but frequency made no clear difference once weekly sets were equal. Used: each muscle twice a week; missed sessions made up with volume, not by calendar. Confidence high.
- Weekly volume: Schoenfeld, Ogborn, Krieger 2017 (J Sports Sci); Pelland et al. (first seen as a 2024 preprint, now cited as the published 2026 meta-regression): more sets give more growth with diminishing returns, a noticeable jump from 6 to 12 sets. Used: weekly bars and bands. Confidence high.
- Proximity to failure: Robinson et al. 2024 (Sports Med, meta-regression): strength similar across a wide range of reps left, growth better closer to failure, exploratory. Used: 0-2 reps left on most sets, 1-3 on heavy hinges and leg press. Moderate.
- Load and rep range: Schoenfeld et al. 2017 (J Strength Cond Res): similar growth across a wide load range, heavy loads build more max strength. Used: 6-15 reps on compounds, 10-20 on isolations. High.
- Protein: Morton et al. 2018 (Br J Sports Med): gains plateau near 1.6 g/kg/day, upper confidence limit about 2.2. Used: 1.6-2.2 g/kg range. High.
- Recomposition and deficit: a 2020 Strength and Conditioning Journal review (found by title) and a Stronger By Science summary: recomposition occurs with progressive training and good nutrition, large deficits make lean gain harder. Used: small deficit, waist and photos. Moderate.
- Spot reduction: a meta-analysis found no local fat loss from training a muscle (via a search listing). Used: no extra oblique work for love handles. Moderate. [resolved] the old text cited "Clemente 2022", which could not be confirmed; that string is no longer in the code.
- Posture: Warneke et al. 2024 (Sports Med Open): in healthy adults stretching did not change posture, strengthening improved thoracic and cervical posture, lumbopelvic effects unclear; BMC Musculoskeletal Disorders 2024 meta-analysis: therapeutic exercise improved rounded shoulders and forward head posture. Used: strengthening-led posture work in every session, stretches dropped. Moderate.
- Muscle length: Maeo and colleagues (seated versus prone leg curl; overhead versus arms-down triceps) via a preprint snippet: seated curl +14.1% versus +9.3% hamstring growth; overhead triceps grew more in several trials, some showed no difference. Used: seated curl and overhead extension prioritised; preacher versus incline curl left open. Low to moderate.
- Honesty notes: anterior pelvic tilt is often normal variation and the link to pain is weak; strengthening glutes, hamstrings and abs and learning a neutral pelvis is reasonable but not a guaranteed fix (the app says so on its posture check). NOT researched, Forge judgement: rest intervals (60-150 s by lift type), the detraining gap multipliers, deload every sixth week and its 0.6 factor, trimming to two thirds on rough days, the mini-session design, calorie numbers, step targets (before v32), starter-weight ratios, Epley estimates, double-progression load steps, the choice of posture exercises, the wall and shoulder self-tests.
v31 research (read as abstracts or publisher pages; none as full text):
- Garthe et al. 2011 (30 elite athletes, 6-12 weeks, aiming at about 0.7% versus 1.4% of body weight a week: slower loss kept or gained lean mass and lost more fat; elite athletes, abstract does not report strength). Used for the 0.75% per week warning line, which is judgement informed by one trial. Note id lossrate.
- Meeusen et al. 2013 (ECSS and ACSM consensus on overtraining; mainly endurance and elite sport): short dips recover, weeks-long decline once other causes are excluded marks non-functional overreaching. Applied by analogy for local versus body-wide fatigue. Note id fatiguelocal (low).
- Orsama et al. 2014 (4,657 daily weights from 80 adults: higher Sunday and Monday, falling through the week). Used to average weekly and never act on one weighing. Note id weightnoise.
- Existing notes reused: Pelland 2026, Schoenfeld 2019, Barakat 2020, Murphy and Koehler 2022, Morton 2018 and others in the rs block.
v32 research on treadmill walking (owner asked what steps, speed and incline do for maximal recomposition). Result: NO trial identifies an optimal speed or incline for recomposition. Read and used:
- Paluch et al. 2022 (Lancet Public Health; 15 cohorts, 47,471 adults, 3,013 deaths, median follow-up 7.1 years): risk of death fell with more steps and levelled off at roughly 8,000-10,000 steps for adults under 60 and 6,000-8,000 for 60 and over; top quartile hazard ratio 0.47 versus bottom; only peak 30 and 60 minute stepping rates stayed associated after adjusting for steps; observational. Note steps.
- Richardson et al. 2008 (Ann Fam Med; 9 pedometer programs, 307 sedentary overweight or obese adults, no diet change, +2,000 to over 4,000 steps a day): pooled loss 1.27 kg (95% CI 0.70-1.85) over a median 16 weeks; before-and-after designs, no controls, diet change possible. Note stepsloss.
- Pontzer et al. 2016 (Current Biology; 332 adults from five populations, doubly labelled water and accelerometry): energy expenditure rose with activity but levelled off at higher activity; observational. Note stepsloss.
- Minetti et al. 2002 (J Appl Physiol; 10 runners, grades up to +/-45%): cost of walking rises steeply uphill; the published fit Cw = 280.5i^5 - 58.7i^4 - 76.8i^3 + 51.9i^2 + 19.6i + 2.5 (J per kg per metre) evaluated at +45% gives about 17.6 against the abstract's 17.33, which supports the coefficients as written; about 2.5 level, 3.6 at 5%, 4.9 at 10%, 6.3 at 15%. The publisher page did not show whether this is net or gross of resting cost; Forge therefore shows a range with the ACSM equation (net of resting). Note inclinecost.
- ACSM walking equation accuracy: only a 2012 Colorado State master's thesis (Reynolds, obese adults) was read; it found ACSM and Pandolf equations did not predict all speed and grade combinations. Low confidence. Two other sources (a Thieme abstract and a PMC page) were blocked by bot checks and were not worked around.
- Maunder, Plews, Kilding 2018 (Frontiers in Physiology review): maximal fat oxidation intensity varies widely (about 56 +/- 8% VO2max endurance-trained lean men, 51 +/- 8 recreationally active, 43 +/- 18 overweight or obese men); not shown to improve fat loss; the review did not study fat loss. Keating et al. 2017 (Obesity Reviews; 31 studies): interval and moderate continuous training gave similar body fat change, neither clinically meaningful short term. Note walkfat. (A Wewege 2017 result was found only as a conference abstract with no results and was not used.)
- Schumann et al. 2022 (Sports Med; 15 studies): concurrent aerobic plus strength training had a small negative effect on muscle fibre hypertrophy (SMD -0.23, 95% CI -0.46 to 0.00), clear for type I fibres with running (-0.81), not with cycling; preliminary; order within session made no difference; walking not analysed. Calbet et al. 2017 (Frontiers in Physiology; 15 overweight men, 4 days, 8 hours of walking a day plus arm cranking in severe deficit): exercise limited fat-free mass loss; too extreme and short to size an everyday dose. Note walkint.
- Tudor-Locke et al. 2019 (CADENCE-adults, 76 adults aged 21-40): about 100 steps per minute is 3 METs (moderate), 130 is 6 METs; wide prediction intervals; absolute not relative intensity. Forge assumes about 105 steps per minute to size treadmill blocks (judgement).
- Entin et al. 2010 (6 subjects, walking speed by grade and load): carbohydrate supplied at least half the energy in all conditions. Read but not used.
- Judgement, not evidence (v32): +1,500 steps over the 14-day average, 15-45 minute blocks, 5 km/h, 6% normal grade, 3% around leg days, 0% when recovery signals are on, 10% cap, holding the target on recovery days.

- Lessons that cost time: pkill -f can kill the shell that issued it, so start servers with a script; the bottom nav floats over full-page screenshots, which is a screenshot artefact; the delegated click handler needs data-a mapped to an A function and sheets close on any data-a="cs"; an assertion on text must allow CSS uppercase; backup validation rejects unknown state shapes, so seed tests with the exact shape the app writes (for example kcal is an object, ov.fx is keyed by muscle id with a date); the fatigue verdict property is verdict (not v); a time-budgeted quick session is saved with mode mini.
- Engine tuning history: single-lift trims caused false positives, so two or more declining lifts are required; a baseline at the peak flagged outliers, so the median of earlier sessions is used; local fatigue was mislabelled when the whole body was soft, so regional mean softness (2.5% or more) now routes to body-wide; body-wide fatigue was under-detected, so it needs at least two lifts down and two corroborating signals; slow recomposers were told to cut, so flatness requires a confidence interval and an "unclear" verdict exists; a reversed calorie range and an undeclared variable were fixed; posture drills were mislabelled "Core" in a planner note.

Format: a line starting with "## id | Title | confidence", then the note text. Forge shows these in Progress > Library and quotes them in Coach advice. Ids used by the app: plateau, pace, failure, deload, detrain, spot, protein, volume, recomp, block, progression, length, rest, cardio.

## volume | Weekly sets drive growth | high
More weekly hard sets generally support muscle growth, with diminishing returns; no single weekly dose is optimal for everyone. A 2026 meta-regression of 67 studies found the fractional method for indirect-set credit best fit its data. These are population-level models, not individual targets (Pelland et al., Sports Medicine 2026). Forge’s bands are starting heuristics, adjusted cautiously using your logged response.

## fractional | Indirect sets count about half | moderate
A bench press set also works triceps and front delts. Crediting indirect sets fractionally (about half) best fit the 2026 meta-regression compared with counting them as full or zero sets (Pelland et al., Sports Medicine 2026). Forge uses this as a practical estimate, not a precise biological measurement.

## sessioncap | Spread volume across the week | moderate
Beyond about 11 effective sets for one muscle in a single session, extra growth was not detectable (2025 per-session meta-regression, secondary summary). That is why missed sets are spread over several days instead of piled onto one.

## acsm | Individualize the training plan | high
The 2026 ACSM position stand summarizes 137 systematic reviews and supports progressive resistance training, while emphasizing that only some prescription choices reliably change outcomes. Higher weekly volume supports hypertrophy, but individual preference, goals, safety and consistency matter. Forge’s plan and volume bands are starting points, not universal requirements (Currier et al., Medicine & Science in Sports & Exercise 2026).

## frequency | Twice a week is enough | moderate
With sets equal, training a muscle 1, 2 or 3 times a week gives similar growth (Schoenfeld 2019); twice beats once (Schoenfeld 2016). Six days is a schedule choice, not a requirement.

## failure | Stop 1 to 3 reps short | moderate
Training to momentary failure is not required for progress and did not consistently change outcomes in the 2026 ACSM overview. Some analyses favor closer effort, but reps-in-reserve estimates are noisy. Forge treats effort as a logged signal, not a rule that every set must meet (ACSM 2026; Refalo 2023; Robinson 2024).

## rir | Your "reps left" is noisy | moderate
People tend to underestimate reps left by about one rep, and are more accurate near failure and on later sets (Halperin review; Remmert 2023). Treat the logged number as plus or minus one rep. Forge damps next-set weight changes on high-rep sets.

## rest | Rest at least 90 seconds | moderate
Resting more than 60 seconds gave a small growth benefit, with no clear difference beyond about 90 seconds (Singer 2024). Heavy leg and back lifts do better with 2 to 3 minutes (Schoenfeld 2016).

## length | Load the stretched position | moderate
Training at long muscle lengths grew muscle at least as well as short lengths, often better (Wolf 2023). Seated leg curls beat lying curls for the hamstrings (Maeo 2020). Control the bottom of each rep and do not cut it short.

## progression | Progress by reps, then weight | moderate
Autoregulated and fixed-percentage loading gave similar strength (Hickmott 2022). Forge uses double progression: hit the top of the rep range on every set, add weight, and start the range again.

## plateau | When a lift stalls | moderate
Three sessions without a new estimated best can be a useful prompt to review, not a diagnosis. Check logging consistency, technique, recovery and effort before changing the plan. Forge’s three-session threshold is a heuristic.

## deload | Deload only when you need one | low
A full week off cost lower-body strength with no growth benefit in one trial (Coleman 2024); lighter weeks did no harm in another (2026). There is no good evidence for fixed calendar deloads. Forge suggests a light week only when several lifts trend down: same weights, about 40% fewer sets.

## detrain | Missed days cost very little | moderate
Up to about 3 weeks off did not reduce final size or strength gains, and lost fitness came back fast (Ogasawara 2011 and 2013; a 2024 trial). Forge spreads missed sets across the week: no guilt, no make-up session.

## recomp | Fat loss and muscle gain together | moderate
Possible with progressive lifting, enough protein and a modest deficit (Barakat 2020). Judge progress by waist, weight trend and strength together, not the scale alone.

## deficit | Keep the deficit small | moderate
Deficits up to about 500 kcal a day did not impair lean-mass gains in a meta-analysis, mostly in beginners (Murphy and Koehler 2022). Forge's guidance is 250 to 400 kcal.

## protein | Protein target | high
Most benefit plateaus near 1.6 g per kg, with about 2.2 g per kg the upper end of the range (Morton 2018). Your range is shown on the home screen.

## spot | No spot reduction | high
Training a body part does not burn fat from that spot (Ramirez-Campillo and colleagues 2022, 13 studies). Love handles shrink with overall fat loss; extra oblique work will not speed it up.

## cardio | Cardio and lifting get along | moderate
Adding cardio does not compromise growth or maximal strength (Schumann 2022); running may slightly blunt leg fibre growth (Lundberg 2022). Walking is the safest add-on. I found no fat-loss-specific evidence for the 8 to 10 thousand step target; it is a habit target (judgement).

## sleep | Sleep: soft evidence | low
One bad night barely changes strength; several nights of restricted sleep reduce force on multi-joint lifts (Knowles 2018). Evidence on long-term growth is thin, so treat 7 to 8 hours as a sensible habit, not a magic lever.

## posture | Posture work | moderate
Strengthening beat stretching for upper-back and neck posture. Pelvic tilt is often normal variation and its link to pain is weak. Forge keeps posture work short and re-tests monthly.

## behaviour | What keeps people consistent | moderate
Goals and self-monitoring each improved activity in app trials, and personalised feedback and reminders helped (Eckerstorfer 2018; Laranjo 2021). Forge shows a consistency score instead of streaks.

## pace | Realistic pace | low
Coach models suggest roughly 0.5 to 1% of body weight a month in lean mass for an early-intermediate lifter, less during a deficit (Aragon, McDonald: heuristics, not trials). Forge shows a range for your weight, never a promise.

## block | Six-week coaching cues | low
Forge shows a changing weekly cue, but the current six-week sequence does not change the workout itself. It is a reminder structure, not a validated training block or peak.

## calibrate | Start from your own numbers | low
Everyone starts at a different level, so body-weight ratios are only a rough guess (judgement). Enter the weight you can lift for about 10 clean reps with 2 left in the tank. Forge converts it to that exercise's rep range with a standard rep-max formula. Nothing is copied from one lift to another, because every machine and bar is different, so type the weight for each lift (you can also type it during a session). Once you log sets, your real numbers take over. Estimates from reps left carry about one rep of error (Halperin review; Remmert 2023).

## readiness | Readiness check | low
A quick rating of sleep, body and energy before training is common coaching practice, but I found no strong evidence that it predicts a better or worse session. One bad night barely changes strength; several nights of restricted sleep reduce force on multi-joint lifts (Knowles 2018). Forge therefore only suggests an easier day when all three ratings are low, and never forces it (judgement).

## warmup | Warm-up ramp | low
Ramp sets before the first lift: about 50% for 8, 70% for 5, 85% for 2. Common practice (judgement); it keeps early sets crisp.
## fatiguelocal | Local versus body-wide fatigue | low
Short-term performance dips that recover within days to weeks are a normal part of hard training. Stagnation or decline lasting weeks or months, once other causes such as nutrition, illness, sleep and stress are excluded, marks non-functional overreaching (Meeusen et al. 2013, ECSS and ACSM consensus, written mainly for endurance and elite sport). Forge applies this by analogy. It reads each lift's estimated best set, compares the last two sessions with the median of the sessions before them and needs a fall of at least 4% with both below it, calls the pattern local when the decline sits in one movement region (push, pull or legs) while the others hold, and body-wide when it spans regions and other signals agree. That split, the thresholds and the quarter-volume trim are Forge's judgement, not validated rules.

## weightnoise | Weight is noisy | moderate
In 4,657 daily weights from 80 adults, body weight was higher on Sunday and Monday and fell through the weekdays (Orsama 2014). A single reading can mislead, so Forge averages each week, fits a line through the weeks, and never changes advice on one reading. Weighing on the same weekday under similar conditions helps. Waist measurement error was not researched; Forge uses a rough noise floor (judgement).

## lossrate | How fast to lose | moderate
In 30 elite athletes who ate less and lifted four times a week for 6 to 12 weeks, aiming for about 0.7% of body weight a week kept or gained lean mass (+2.0%) and lost more fat (-31%) than aiming for about 1.4% a week (lean mass +1.1%, not significant; fat -23%) (Garthe 2011). Participants were elite athletes, not recreational lifters, and the abstract does not report strength. Forge's 0.75% a week warning line is a judgement informed by this one trial.


## steps | Daily steps and health | moderate
A pooled analysis of 15 cohorts (47,471 adults, 3,013 deaths, median follow-up 7.1 years) found that risk of death fell as daily steps rose, then levelled off at roughly 8,000 to 10,000 steps a day for adults under 60 and 6,000 to 8,000 for adults 60 and over; the highest step quartile had a hazard ratio of 0.47 against the lowest (Paluch 2022). The data are observational, so they show association, not that steps cause the benefit, and reverse causation is possible. Step intensity added little beyond total steps (peak 30-minute and 60-minute stepping rates stayed associated; time at 40+ or 100+ steps a minute did not). The outcome was death, not body composition. Forge uses 8,000 to 10,000 as the range to aim for and does not push beyond 10,000.

## stepsloss | Steps and fat loss | low
Nine pedometer programs in 307 sedentary overweight or obese adults, without diet change, raised steps by about 2,000 to over 4,000 a day and produced a pooled loss of 1.27 kg (95% CI 0.70 to 1.85) over a median of 16 weeks (Richardson 2008). The studies were mostly small before-and-after designs without control groups, so some of the loss may be diet change. Separately, in 332 adults from five populations, total energy expenditure rose with activity but levelled off at higher activity levels (Pontzer 2016, observational), so extra steps do not add energy one-for-one. Forge treats steps as a modest nudge to energy balance and health and never converts them into a promised calorie figure. No study here was done in resistance-trained people trying to recompose.

## inclinecost | Incline walking energy cost | moderate
In 10 runners on a treadmill, the metabolic cost of walking rose steeply with uphill grade; the published fit is Cw = 280.5i^5 - 58.7i^4 - 76.8i^3 + 51.9i^2 + 19.6i + 2.5 (J per kg per metre, i = grade as a fraction), which gives about 2.5 at level and roughly 3.6, 4.9 and 6.3 at 5%, 10% and 15% (Minetti 2002). Incline therefore raises energy use per minute without adding impact, at the price of more load on calves, glutes and hamstrings. The ACSM walking equation is the other common estimate; it is known to mispredict at some speed and grade combinations (one thesis in obese adults found this), and the two methods differ. Forge shows a range from the two, rounded to 10 kcal, and treats it as an estimate that can be off by 20% or more. No trial identifies a best speed or incline for recomposition; Forge's defaults (about 5 km/h; 0%, 3% or 6% grade; 10% at most) are judgement chosen for low recovery cost.

## walkfat | The fat-burning zone | moderate
The exercise intensity that burns the largest share of fat (Fatmax) varies widely between people (for example about 56 +/- 8% of VO2max in endurance-trained lean men versus 43 +/- 18% in overweight or obese men) and is not shown to improve fat loss or body composition when trained at; the review itself did not study those outcomes (Maunder 2018). In 31 studies, interval training and moderate continuous training changed body fat by similar amounts, and neither produced clinically meaningful fat loss in the short term (Keating 2017). Forge therefore picks walking speed and incline by recovery cost and energy use, not by a fat-burning zone.

## walkint | Walking next to lifting | low
In 15 studies, adding supervised aerobic training to the same strength program had a small negative effect on muscle fibre growth (standardised difference -0.23, 95% CI -0.46 to 0.00); the effect was clear for type I fibres with running (-0.81) but not with cycling, the authors call it preliminary, and same-session order made no detectable difference (Schumann 2022). Walking was not analysed, so Forge does not assume it is free; it keeps incline modest on and around leg days and when body-wide fatigue is flagged (judgement). In 15 overweight men, 8 hours of daily walking plus arm cranking for 4 days in a severe energy deficit limited fat-free mass loss compared with the unexercised arm (Calbet 2017), but that dose and duration say nothing about everyday walking. Forge sizes treadmill blocks with about 105 steps a minute; about 100 steps a minute marks moderate effort (3 METs) in adults aged 21 to 40, with wide individual variation (Tudor-Locke 2019).
